services:
  frontend:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    # https://docs.docker.com/compose/how-tos/file-watch/
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: "no"

  backend:
    build:
      target: dev
    environment:
      APP_ENV: development
      APP_DEMO_MODE: "true"
    ports:
      - "127.0.0.1:${BACKEND_DEV_PORT:-8000}:8000"
    volumes:
      - ./backend/application:/app/backend/application:ro
      - ./backend/domain:/app/backend/domain:ro
      - ./backend/presentation:/app/backend/presentation:ro
      - ./backend/infrastructure:/app/backend/infrastructure:ro
      - ./backend/config:/app/backend/config:ro
    restart: "no"
